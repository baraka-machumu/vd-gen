# mypy settings for the stdlib-only scripts. backend/ and ai-engine/ carry their own [tool.mypy] in pyproject.toml.
[mypy]
python_version = 3.12
warn_unused_ignores = True
warn_redundant_casts = True
check_untyped_defs = True
# gpu_smoke.py imports torch, which only exists on the GX10 / in the NGC container.
ignore_missing_imports = True

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Repo-wide checks: the same hooks developers run locally (.pre-commit-config.yaml):
  # file hygiene, LF endings, ruff lint + format, mypy on scripts, STATUS.md freshness (ADR-011).
  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  # Backend: strict mypy, unit + API tests, and integration tests against PostgreSQL with pgvector.
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.12
      - run: uv run mypy app tests alembic
      - run: uv run pytest

  # API image for linux/arm64 (the GX10, spec §37), built under QEMU; then import the app inside it to prove
  # every wheel resolved for aarch64. The amd64 image is built and exercised by compose-smoke.
  image-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/arm64
          load: true
          tags: yas-api:arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: >
          docker run --rm --platform linux/arm64 --entrypoint python yas-api:arm64 -c
          "import platform, app.main, asyncpg; assert platform.machine() == 'aarch64', platform.machine();
          print('arm64 image ok')"

  # Whole control plane via docker compose: health, routing, request ids, object-store permissions, network isolation.
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci/compose_smoke.sh

  # Frontend eslint/tsc/test job: added with M27.

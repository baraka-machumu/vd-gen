# Edge proxy: the only published service (spec §65, §66). Private LAN/VPN only.
# /media/* (ADR-010: auth_request against the API, then proxy to the object store) is added with M09,
# together with the API endpoint that authorises it. Until then nothing in the object store is reachable here.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    # Non-root nginx: temp paths must be writable by the nginx user.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    log_format json escape=json '{"ts":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
                                '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
                                '"duration_s":$request_time,"request_id":"$req_id"}';
    access_log /dev/stdout json;

    # Pass the caller's X-Request-ID through, or create one, so nginx and API logs share it.
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    upstream api {
        server api:8000;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;

        # Reference uploads (images, short videos) are large; adjust with M09 upload limits.
        client_max_body_size 512m;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        location = /health {
            proxy_pass http://api;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/ {
            proxy_pass http://api;
            include /etc/nginx/proxy_params.conf;
            proxy_read_timeout 300s;
        }

        # FastAPI docs and schema; internal network only, like everything else here.
        location ~ ^/(docs|redoc|openapi\.json)$ {
            proxy_pass http://api;
            include /etc/nginx/proxy_params.conf;
        }

        # The web portal (M27) is served here once it exists.
        location / {
            default_type application/json;
            return 404 '{"error":{"code":"not_found","message":"Not Found"}}';
        }
    }
}
